    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('zackjad_current_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('zackjad_users');
        return saved ? JSON.parse(saved) : INITIAL_USERS;
      });

      const [pins, setPins] = useState(() => {
        const saved = localStorage.getItem('zackjad_pins');
        return saved ? JSON.parse(saved) : INITIAL_PINS;
      });

      const [reels, setReels] = useState(() => {
        const saved = localStorage.getItem('zackjad_reels');
        return saved ? JSON.parse(saved) : INITIAL_REELS;
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('zackjad_transactions');
        return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
      });

      const [adminCard, setAdminCard] = useState(() => {
        const saved = localStorage.getItem('zackjad_admin_card');
        return saved ? JSON.parse(saved) : { linked: false, provider: '' };
      });

      const [activeTab, setActiveTab] = useState('feed');
      const [messages, setMessages] = useState(() => { try { return JSON.parse(localStorage.getItem('zackjad_messages') || '[]'); } catch { return []; } });
      const [messageDraft, setMessageDraft] = useState('');
      const [messageRecipient, setMessageRecipient] = useState('user-2');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');

      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); 
      const [authMethod, setAuthMethod] = useState('email'); 
      const [pendingUserData, setPendingUserData] = useState(null);
      const [generatedOTP, setGeneratedOTP] = useState('');
      const [enteredOTP, setEnteredOTP] = useState('');
      const [otpNotice, setOtpNotice] = useState('');

      const [createPinOpen, setCreatePinOpen] = useState(false);
      const [editProfileOpen, setEditProfileOpen] = useState(false);
      const [activePinDetail, setActivePinDetail] = useState(null);
      const [viewingProfileId, setViewingProfileId] = useState(null);

      const [premiumModalOpen, setPremiumModalOpen] = useState(false);
      const [selectedPlan, setSelectedPlan] = useState('Pro Creator');
      const [paymentMethod, setPaymentMethod] = useState('mpesa');
      const [mpesaPhone, setMpesaPhone] = useState('+254 ');
      const [cardNumber, setCardNumber] = useState('');
      const [cardExpiry, setCardExpiry] = useState('');
      const [cardCvc, setCardCvc] = useState('');
      const [isProcessingPayment, setIsProcessingPayment] = useState(false);

      useEffect(() => {
        localStorage.setItem('zackjad_current_user', JSON.stringify(currentUser));
      }, [currentUser]);

      useEffect(() => {
        localStorage.setItem('zackjad_users', JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        localStorage.setItem('zackjad_pins', JSON.stringify(pins));
      }, [pins]);

      useEffect(() => {
        localStorage.setItem('zackjad_reels', JSON.stringify(reels));
      }, [reels]);

      useEffect(() => { localStorage.setItem('zackjad_messages', JSON.stringify(messages)); }, [messages]);

      useEffect(() => {
        localStorage.setItem('zackjad_transactions', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('zackjad_admin_card', JSON.stringify(adminCard));
      }, [adminCard]);

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        const form = e.target;
        const credential = form.credential.value.trim();
        const password = form.password?.value || "";
        if (!firebaseConfigured || !firebaseAuth) {
          alert("Authentication setup required: add your Firebase Web App config, then enable Google, Email/Password, and Phone in Firebase Console.");
          return;
        }
        try {
          if (authMethod === 'email') {
            if (authMode === 'signup') {
              const result = await firebaseAuth.createUserWithEmailAndPassword(credential, password);
              const name = form.name.value.trim();
              await result.user.updateProfile({ displayName: name });
              const u = { id: result.user.uid, email: result.user.email, phone: '',
                username: form.username.value.trim().toLowerCase(), name,
                avatar: result.user.photoURL || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80',
                cover: '', bio: 'Creative member on Zackjad Visual Platform.', followers: [], following: [],
                isAdmin: false, isPremium: false, planType: 'Free Member' };
              setUsers(prev => [u, ...prev.filter(x => x.id !== u.id)]);
              setCurrentUser(u); setAuthModalOpen(false);
            } else {
              const result = await firebaseAuth.signInWithEmailAndPassword(credential, password);
              const tokenInfo = await result.user.getIdTokenResult(true);
              const isDesignatedAdmin = tokenInfo.claims.admin === true;
              let u = users.find(x => x.id === result.user.uid || x.email?.toLowerCase() === credential.toLowerCase());
              if (!u) u = { id: result.user.uid, email: result.user.email, phone: '',
                username: (result.user.displayName || credential.split('@')[0]).toLowerCase().replace(/[^a-z0-9_]/g,''),
                name: result.user.displayName || credential.split('@')[0],
                avatar: result.user.photoURL || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80',
                cover: '', bio: 'Creative member on Zackjad Visual Platform.', followers: [], following: [],
                isAdmin: isDesignatedAdmin, isPremium: false, planType: isDesignatedAdmin ? 'Administrator' : 'Free Member' };
              u = { ...u, isAdmin: isDesignatedAdmin, planType: isDesignatedAdmin ? 'Administrator' : (u.planType || 'Free Member') };
              setUsers(prev => prev.some(x => x.id === u.id) ? prev.map(x => x.id === u.id ? u : x) : [u, ...prev]);
              setCurrentUser(u); setAuthModalOpen(false);
            }
          } else {
            const phone = credential.replace(/[\s()-]/g, '');
            if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
              alert("Use international format, e.g. +254700000000."); return;
            }
            if (!window.zackjadRecaptcha) {
              window.zackjadRecaptcha = new firebase.auth.RecaptchaVerifier('zackjad-recaptcha', { size: 'normal' });
              await window.zackjadRecaptcha.render();
            }
            window.zackjadPhoneConfirmation = await firebaseAuth.signInWithPhoneNumber(phone, window.zackjadRecaptcha);
            setPendingUserData(authMode === 'signup' ? {
              id: '', email: '', phone, username: form.username.value.trim().toLowerCase(),
              name: form.name.value.trim(),
              avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80',
              cover: '', bio: 'Creative member on Zackjad Visual Platform.', followers: [], following: [],
              isAdmin: false, isPremium: false, planType: 'Free Member'
            } : null);
            setAuthMode('otp');
            setOtpNotice('A real verification code has been sent by SMS to ' + phone + '.');
          }
        } catch (error) { alert(error.message || 'Authentication failed. Please try again.'); }
      };

      const handleVerifyOTP = async (e) => {
        e.preventDefault();
        try {
          if (!window.zackjadPhoneConfirmation) { alert('Request an OTP first.'); return; }
          const result = await window.zackjadPhoneConfirmation.confirm(enteredOTP.trim());
          const au = result.user;
          let u = users.find(x => x.id === au.uid || x.phone === au.phoneNumber);
          if (!u) {
            u = { ...(pendingUserData || {}), id: au.uid, phone: au.phoneNumber, email: au.email || '',
              username: pendingUserData?.username || ('user' + Date.now().toString().slice(-6)),
              name: pendingUserData?.name || au.displayName || 'Zackjad Member',
              avatar: pendingUserData?.avatar || au.photoURL || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80',
              followers: [], following: [], isAdmin: false, isPremium: false, planType: 'Free Member' };
            setUsers(prev => [u, ...prev.filter(x => x.id !== u.id)]);
          }
          setCurrentUser(u); setEnteredOTP(''); setPendingUserData(null);
          window.zackjadPhoneConfirmation = null; setAuthModalOpen(false);
        } catch (error) { alert(error.message || 'Invalid OTP. Please try again.'); }
      };

      const handleGoogleSignIn = async () => {
        if (!firebaseConfigured || !firebaseAuth) {
          alert('Connect Firebase and enable Google sign-in in Firebase Console first.'); return;
        }
        try {
          const result = await firebaseAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
          const au = result.user;
          const tokenInfo = await au.getIdTokenResult(true);
          const isDesignatedAdmin = tokenInfo.claims.admin === true;
          let u = users.find(x => x.id === au.uid || x.email?.toLowerCase() === au.email?.toLowerCase());
          if (!u) {
            u = { id: au.uid, email: au.email || '', phone: '',
              username: (au.displayName || au.email.split('@')[0]).toLowerCase().replace(/[^a-z0-9_]/g,''),
              name: au.displayName || 'Zackjad Member',
              avatar: au.photoURL || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80',
              cover: '', bio: 'Creative member on Zackjad Visual Platform.', followers: [], following: [],
              isAdmin: isDesignatedAdmin, isPremium: false, planType: isDesignatedAdmin ? 'Administrator' : 'Free Member' };
            setUsers(prev => [u, ...prev]);
          }
          u = { ...u, isAdmin: isDesignatedAdmin, planType: isDesignatedAdmin ? 'Administrator' : (u.planType || 'Free Member') };
          setCurrentUser(u); setAuthModalOpen(false);
        } catch (error) { alert(error.message || 'Google sign-in failed.'); }
      };

      const handleUpgradeSubmit = (e) => {
        e.preventDefault();
        if (!currentUser) return setAuthModalOpen(true);
        alert('Payments are not live yet. Connect a supported payment provider on a secure backend and verify payment webhooks before enabling subscriptions. This demo will not charge a card or mark an order as paid.');
      };

      const handleSaveAdminCard = (e) => {
        e.preventDefault();
        alert('For security, Zackjad must not collect or store raw card numbers in this page. Configure a payment provider with hosted onboarding/checkout and server-side webhooks before accepting payments. No payout account has been linked by this demo.');
      };

      const handleToggleFollow = (targetUserId) => {
        if (!currentUser) return setAuthModalOpen(true);
        if (currentUser.id === targetUserId) return;

        const isFollowing = currentUser.following.includes(targetUserId);

        setUsers(prevUsers => prevUsers.map(user => {
          if (user.id === currentUser.id) {
            const updatedFollowing = isFollowing
              ? user.following.filter(id => id !== targetUserId)
              : [...user.following, targetUserId];
            
            const updatedUser = { ...user, following: updatedFollowing };
            setCurrentUser(updatedUser);
            return updatedUser;
          }
          if (user.id === targetUserId) {
            const updatedFollowers = isFollowing
              ? user.followers.filter(id => id !== currentUser.id)
              : [...user.followers, currentUser.id];
            return { ...user, followers: updatedFollowers };
          }
          return user;
        }));
      };

      const handleLikePin = (pinId) => {
        if (!currentUser) return setAuthModalOpen(true);
        setPins(prev => prev.map(pin => {
          if (pin.id === pinId) {
            const hasLiked = pin.likes.includes(currentUser.id);
            const newLikes = hasLiked 
              ? pin.likes.filter(id => id !== currentUser.id)
              : [...pin.likes, currentUser.id];
            return { ...pin, likes: newLikes };
          }
          return pin;
        }));
      };

      const handleSavePin = (pinId) => {
        if (!currentUser) return setAuthModalOpen(true);
        setPins(prev => prev.map(pin => {
          if (pin.id === pinId) {
            const hasSaved = pin.saves.includes(currentUser.id);
            const newSaves = hasSaved 
              ? pin.saves.filter(id => id !== currentUser.id)
              : [...pin.saves, currentUser.id];
            return { ...pin, saves: newSaves };
          }
          return pin;
        }));
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        const form = e.target;
        const updatedProfile = {
          name: form.name.value,
          username: form.username.value,
          bio: form.bio.value,
          avatar: form.avatar.value || currentUser.avatar
        };

        setUsers(prev => prev.map(u => u.id === currentUser.id ? { ...u, ...updatedProfile } : u));
        setCurrentUser(prev => ({ ...prev, ...updatedProfile }));
        setEditProfileOpen(false);
      };

      const handleDeletePin = (pinId) => {
        if (!currentUser?.isAdmin) return;
        setPins(prev => prev.filter(p => p.id !== pinId));
        if (activePinDetail?.id === pinId) setActivePinDetail(null);
      };

      const categories = ['All', 'Interior', 'Photography', 'Branding', 'Architecture', 'UI/UX', 'Art'];

      const displayedPins = pins.filter(pin => {
        const matchesCategory = selectedCategory === 'All' || pin.category === selectedCategory;
        const matchesSearch = pin.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              pin.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const liveAdmin = users.find(u => u.isAdmin || u.email.toLowerCase() === ADMIN_CREDENTIALS.email.toLowerCase()) || {
        name: ADMIN_CREDENTIALS.name,
        username: ADMIN_CREDENTIALS.username,
        avatar: ADMIN_CREDENTIALS.avatar,
        bio: ADMIN_CREDENTIALS.bio
      };

      const activeProfileUser = viewingProfileId 
        ? users.find(u => u.id === viewingProfileId) || currentUser
        : currentUser;

      return (
        <div className="min-h-screen flex flex-col justify-between bg-[#0f172a]">
          
          {/* HEADER / NAVIGATION */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              
              <div 
                onClick={() => { setActiveTab('feed'); setViewingProfileId(null); }} 
                className="flex items-center gap-2.5 cursor-pointer group"
              >

            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card max-w-md w-full p-6 rounded-2xl border border-slate-800 relative shadow-2xl">
                <button 
                  onClick={() => setCreatePinOpen(false)}
                  className="absolute right-4 top-4 text-slate-400 hover:text-white"
                >
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                <h3 className="font-extrabold text-xl text-white mb-4">Create New Pin</h3>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newPin = {
                    id: 'pin-' + Date.now(),
                    title: form.title.value,
                    description: form.description.value,
                    image: form.image.value || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
                    category: form.category.value,
                    authorId: currentUser.id,
                    likes: [],
                    saves: [],
                    comments: [],
                    createdAt: 'Just now'
                  };
                  setPins(prev => [newPin, ...prev]);
                  setCreatePinOpen(false);
                }} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Pin Title</label>
                    <input name="title" type="text" required placeholder="Minimalist Architectural Concept" className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Image URL</label>
                    <input name="image" type="url" required placeholder="https://images.unsplash.com/photo-..." className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Category</label>
                    <select name="category" className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white">
                      {categories.filter(c => c !== 'All').map(cat => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Description</label>
                    <textarea name="description" rows="3" placeholder="Share story behind this visual post..." className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white"></textarea>
                  </div>

                  <button type="submit" className="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-xl transition-all">
                    Publish Pin
                  </button>
                </form>
              </div>
            </div>
          )}

          {editProfileOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card max-w-md w-full p-6 rounded-2xl border border-slate-800 relative shadow-2xl">
                <button 
                  onClick={() => setEditProfileOpen(false)}
                  className="absolute right-4 top-4 text-slate-400 hover:text-white"
                >
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                <h3 className="font-extrabold text-xl text-white mb-4">Edit Profile</h3>

                <form onSubmit={handleSaveProfile} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Full Name</label>
                    <input name="name" type="text" defaultValue={currentUser?.name} required className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Username</label>
                    <input name="username" type="text" defaultValue={currentUser?.username} required className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Avatar Picture URL</label>
                    <input name="avatar" type="url" defaultValue={currentUser?.avatar} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Bio</label>
                    <textarea name="bio" rows="3" defaultValue={currentUser?.bio} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white"></textarea>
                  </div>

                  <button type="submit" className="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-xl transition-all">
                    Save Changes
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Appwrite connection setup -->
  <script>
    (function () {
      if (!window.Appwrite) {
        console.error("Appwrite SDK did not load. Check your internet connection or the SDK script URL.");
        return;
      }

      const appwriteClient = new Appwrite.Client();
      appwriteClient
        .setEndpoint("https://fra.cloud.appwrite.io/v1")
        .setProject("6addcd370003b817c38e");

      // Make the configured client available to the existing site scripts.
      window.appwriteClient = appwriteClient;
      window.zackjadAppwrite = {
        client: appwriteClient,
        endpoint: "https://fra.cloud.appwrite.io/v1",
        projectId: "6addcd370003b817c38e"
      };

      console.log("Zackjad Appwrite client initialized");

      // Check whether the Appwrite endpoint is reachable. This verifies
      // connectivity only; it does not sign a user in or access a database.
      fetch("https://fra.cloud.appwrite.io/v1/health")
        .then(function (response) {
          if (!response.ok) throw new Error("Health check returned HTTP " + response.status);
          return response.json().catch(function () { return {}; });
        })
        .then(function () {
          console.log("Appwrite endpoint reachable. Client initialized successfully.");
        })
        .catch(function (error) {
          console.error("Appwrite endpoint health check failed:", error);
          console.info("The client is configured; check the browser console and Appwrite project settings if the endpoint is unreachable.");
        });
    })();
  </script>
</body>
</html>
